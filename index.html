<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Study Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #1a202c; }
        p { color: #4a5568; }
        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
        }
        #result {
            margin-top: 20px;
            color: #38a169;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Привет! 👋</h1>
    <p>Это приложение для изучения английского.</p>
    <button id="btn">Начать урок</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('btn').addEventListener('click', () => {
            document.getElementById('result').innerText = 'Отправлено боту!';
            tg.sendData(JSON.stringify({ action: 'start' }));
        });
    </script>
</body>
</html>
